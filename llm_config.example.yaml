# LLM Configuration
# This file defines available models, providers, and task assignments

# Model Providers Configuration
#
# allow_byok (optional, default false): when true, users may store their own
# API key for this provider (Bring Your Own Key). Their key then overrides the
# platform key for every model of this provider in that user's agent runs.
#
# catalog (optional): the provider's part in the model catalog, which reads the
# provider's model listing and compares it with the models below
# (docs/model-catalog.md). `catalog: {enabled: false}` leaves the provider out.
# The catalog never makes a model usable: only an entry under `models` does.
providers:
  openai:
    name: 'OpenAI'
    api_key_env: 'OPENAI_API_KEY'
    base_url: 'https://api.openai.com/v1'
    requires_api_key: true
    openai_compatible: true
    allow_byok: true

  xai:
    name: 'xAI'
    api_key_env: 'XAI_API_KEY'
    base_url: 'https://api.x.ai/v1'
    requires_api_key: true
    openai_compatible: false

  gemini:
    name: 'Google Gemini'
    api_key_env: 'GOOGLE_API_KEY'
    requires_api_key: true
    openai_compatible: false

  claude:
    name: 'Anthropic Claude'
    api_key_env: 'ANTHROPIC_API_KEY'
    requires_api_key: true
    openai_compatible: false

  ollama:
    name: 'Ollama Local'
    base_url: 'http://localhost:11434'
    requires_api_key: false
    openai_compatible: false

  custom_openai_compatible:
    name: 'Custom OpenAI Compatible'
    api_key_env: 'CUSTOM_LLM_API_KEY'
    base_url: 'https://api.custom-llm.com/v1'
    requires_api_key: true
    openai_compatible: true

  deepinfra:
    name: 'DeepInfra'
    api_key_env: 'DEEPINFRA_API_TOKEN'
    requires_api_key: true
    openai_compatible: false

  fireworks:
    name: 'Fireworks AI'
    api_key_env: 'FIREWORKS_API_KEY'
    requires_api_key: true
    openai_compatible: false

  mistral:
    name: 'Mistral AI'
    api_key_env: 'MISTRAL_API_KEY'
    requires_api_key: true
    openai_compatible: false
    # Optional endpoint override (self-hosted / regional deployments).
    # Unset uses https://api.mistral.ai/v1 (or MISTRAL_BASE_URL when exported).
    # The global endpoint does not commit to where a request is processed;
    # the regional ones do: https://api.eu.mistral.ai/v1 (EU/EFTA) and
    # https://api.us.mistral.ai/v1. A regional endpoint serves only the models
    # hosted in its region, costs 1.1x the list price, and has no Batch, Files
    # or Agents API (inference-core calls none of them for Mistral). The model
    # catalog reads the listing of this same endpoint.
    # Source: https://docs.mistral.ai/inference/regional-inference
    # base_url: 'https://api.eu.mistral.ai/v1'
    # What the provider charges against the list prices in its models'
    # `pricing` (default 1.0). Every cost computed for its models is scaled by
    # it, so the prices below stay the list prices.
    # price_multiplier: 1.1

  cortecs:
    name: 'Cortecs'
    # The Cortecs gateway (Cortecs GmbH, Vienna) routes OpenAI-shaped requests
    # to models hosted by European clouds (OVH, IONOS, Scaleway, Mistral, ...).
    # Its address is always this base_url: inference-core has no default.
    # Source: https://docs.cortecs.ai/api/api-compatibility
    base_url: 'https://api.cortecs.ai/v1'
    api_key_env: 'CORTECS_API_KEY'
    requires_api_key: true
    openai_compatible: true
    allow_byok: true
    # Added to the body of every request (chat and embeddings): the gateway's
    # routing rules. eu_native keeps a request with providers established in
    # the EU, allow_zero_data_retention with endpoints that keep no data.
    # The same settings exist per project in the Cortecs console, where they
    # can also be enforced for every key ("Allow overwrite" off).
    # Source: https://docs.cortecs.ai/routing/routing-concept
    request_options:
      eu_native: true
      allow_zero_data_retention: true
    # A model or embeddings entry may add its own request_options (for
    # example allowed_providers, to pin the host of that entry only); they
    # win over these key by key. The keys listed here are the exception: an
    # entry that changes one is refused when the config is loaded. With
    # "Allow overwrite" on in the Cortecs console, a request's fields replace
    # the project's settings, so this keeps an entry from lifting them.
    # locked_request_options: [eu_native, allow_zero_data_retention]

# Available Models Configuration
#
# `provider` is one of the providers above or a name the application registered
# with register_chat_model_provider() (see docs/custom-model-providers.md); a
# registered provider needs no entry under `providers`.
models:
  # Prices below are per 1M tokens (cost_per_1m) and were captured 2026-10-11.
  # Providers change them: check the linked pricing page before relying on one.

  # OpenAI Models
  # Source: https://developers.openai.com/api/docs/pricing
  # NOTE: GPT-6 prompts over 272K tokens are charged more (input x2, output x1.5).
  # `context_tiers` takes one multiplier per tier, so that surcharge is not modelled.
  gpt-6.1-sol:
    provider: 'openai'
    display_name: 'GPT-6.1 Sol'
    description: 'Mid-tier GPT-6 model for complex chat and tool-using tasks'
    max_tokens: 8192
    temperature: 0.7
    # Multimodal (vision) capable. Drives capability-aware tool routing.
    multimodal: true
    # Reasoning output configuration (optional)
    # Provider-specific kwargs passed to LangChain model constructor when
    # reasoning_output is enabled on an agent. Each provider uses its own format.
    # OpenAI models use the 'reasoning' kwarg.
    reasoning_config:
      reasoning:
        effort: "low"
        summary: "auto"
    pricing:
      currency: USD
      input:
        cost_per_1m: 2 # $2.00 per 1M tokens
      output:
        cost_per_1m: 10 # $10.00 per 1M tokens
      extras:
        cache_read_tokens:
          cost_per_1m: 0.1 # cached input $0.10 per 1M
      key_aliases:
        prompt_tokens: input_tokens
        completion_tokens: output_tokens
        cached_input: cache_read_tokens
      rounding:
        decimals: 6
      # Keys that only break down input or output: no price, not estimated.
      extras_policy:
        breakdown_keys: [total_tokens, reasoning_tokens]

  gpt-6-luna:
    provider: 'openai'
    display_name: 'GPT-6 Luna'
    description: 'Cheapest GPT-6 model for fast general tasks'
    max_tokens: 8192
    temperature: 0.7
    multimodal: true
    reasoning_config:
      reasoning:
        effort: "high"
        summary: "auto"
    pricing:
      currency: USD
      input:
        cost_per_1m: 0.1 # $0.10 per 1M
      output:
        cost_per_1m: 0.5 # $0.50 per 1M
      extras:
        cache_read_tokens:
          cost_per_1m: 0.01 # cached input $0.01 per 1M
      key_aliases:
        prompt_tokens: input_tokens
        completion_tokens: output_tokens
        cached_input: cache_read_tokens
      rounding:
        decimals: 6
      # Keys that only break down input or output: no price, not estimated.
      extras_policy:
        breakdown_keys: [total_tokens, reasoning_tokens]

  gpt-5-nano:
    provider: 'openai'
    display_name: 'GPT-5 Nano'
    description: 'Fast and efficient for most tasks'
    max_tokens: 4096
    temperature: 0.7
    multimodal: true
    # Example of extra/nested parameters supported by the core:
    # These must also be added to 'allowed' in param_policies for the provider
    logit_bias:
      '50256': -100
    response_format:
      type: 'json_object'
    pricing:
      currency: USD
      input:
        cost_per_1m: 0.05 # $0.05 per 1M
      output:
        cost_per_1m: 0.4 # $0.40 per 1M
      extras:
        cache_read_tokens:
          cost_per_1m: 0.005 # cached input $0.005 per 1M
      key_aliases:
        prompt_tokens: input_tokens
        completion_tokens: output_tokens
        cached_input: cache_read_tokens
      rounding:
        decimals: 6
      # Keys that only break down input or output: no price, not estimated.
      extras_policy:
        breakdown_keys: [total_tokens, reasoning_tokens]

  # xAI Grok Models
  grok-4.3-latest:
    provider: 'xai'
    display_name: 'Grok 4.3'
    description: 'Grok model for complex chat and tool-using tasks'
    max_tokens: 8192
    temperature: 0.7
    pricing:
      currency: USD
      input:
        cost_per_1m: 1.25 # $1.25 per 1M tokens
      output:
        cost_per_1m: 2.5 # $2.50 per 1M tokens
      # Keys that only break down input or output: no price, not estimated.
      extras_policy:
        breakdown_keys: [total_tokens, reasoning_tokens]
    reasoning_config:
      reasoning_effort: 'high'

  grok-4.7:
    provider: 'xai'
    display_name: 'Grok 4.7'
    description: 'Newest Grok model; costs more than Grok 4.3'
    max_tokens: 8192
    temperature: 0.7
    pricing:
      currency: USD
      input:
        cost_per_1m: 2 # $2.00 per 1M tokens
      output:
        cost_per_1m: 6 # $6.00 per 1M tokens
      extras:
        cache_read_tokens:
          cost_per_1m: 0.5 # cached input $0.50 per 1M
      # Keys that only break down input or output: no price, not estimated.
      extras_policy:
