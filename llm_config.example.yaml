  # Gemini Models
  # Source: https://ai.google.dev/gemini-api/docs/pricing
  gemini-3.8-flash: # Fast multimodal
    provider: 'gemini'
    display_name: 'Gemini 3.8 Flash'
    description: 'Fast Gemini model for general tasks'
    max_tokens: 8192
    temperature: 0.7
    multimodal: true
    # Gemini models use thinking_level + include_thoughts for reasoning.
    reasoning_config:
      thinking_level: "low"
      include_thoughts: true
    # NOTE: these prices hold through 2026-12-31. From 2027-01-01 Google charges
