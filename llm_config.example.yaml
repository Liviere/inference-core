    pricing:
      currency: USD
      input:
        cost_per_1m: 0.75 # $0.75 per 1M tokens
      output:
        cost_per_1m: 3.75 # $3.75 per 1M tokens
      extras:
        cache_read_tokens:
          cost_per_1m: 0.075 # context caching $0.075 per 1M
      key_aliases:
        prompt_tokens: input_tokens
        completion_tokens: output_tokens
        cached_input: cache_read_tokens
      rounding:
        decimals: 6
      # Keys that only break down input or output: no price, not estimated.
      extras_policy:
        breakdown_keys: [total_tokens, reasoning_tokens]

  gemini-3.1-flash-lite: # Cheapest
    provider: 'gemini'
    display_name: 'Gemini 3.1 Flash Lite'
    description: 'The most cost effective Gemini model for general tasks'
    max_tokens: 8192
