    pricing:
      currency: USD
      input:
        cost_per_1m: 0.25 # $0.25 per 1M tokens
      output:
        cost_per_1m: 1.5 # $1.50 per 1M tokens
      extras:
        cache_read_tokens:
          cost_per_1m: 0.025 # context caching $0.025 per 1M
      key_aliases:
        prompt_tokens: input_tokens
        completion_tokens: output_tokens
        cached_input: cache_read_tokens
      rounding:
        decimals: 6
      # Keys that only break down input or output: no price, not estimated.
      extras_policy:
        breakdown_keys: [total_tokens, reasoning_tokens]

  # Claude Models
  # Source: https://platform.claude.com/docs/en/about-claude/pricing
  # Cache writes: langchain-anthropic counts them in input_tokens, and cost
  # tracking names them `ephemeral_5m_input_tokens_tokens` /
  # `ephemeral_1h_input_tokens_tokens` (every token detail gets a `_tokens`
  # suffix), or `cache_creation_tokens` for a response without the TTL
  # breakdown (a streamed one: the factory streams every call). The aliases
  # map them to `cache_write_tokens` (the 5-minute rate, 1.25x input) and
  # `cache_write_1h_tokens` (2x input); `cache_creation_tokens` goes to the
  # rate of the entry's `prompt_cache` lifetime, since that is the only
  # lifetime its requests ask for (inference-core warns when the file reads
  # otherwise). A name with `cache` in it is taken out of the input tokens, so
  # a write is priced once, at its own rate. Thinking is part of output_tokens, at the output price.
  # Claude models use the 'thinking' kwarg. These models take adaptive thinking
  # only: a thinking budget, `temperature` and `top_p` are rejected by the API
  # (see the `dropped` entries under param_policies).
  # They think even when the request leaves `thinking` out, but return the text
  # of their thinking only with `display: "summarized"`: the default
  # (`"omitted"`) streams thinking blocks with an empty text, so no reasoning
  # reaches the stream. `display` changes what is returned, not what is billed.
  claude-opus-5-5:
    provider: 'claude'
    display_name: 'Claude Opus 5.5'
    description: 'Claude Opus 5.5, for complex agents and coding'
    max_tokens: 8192
    multimodal: true
    reasoning_config:
      thinking:
        type: "adaptive"
        display: "summarized"
    # A thinking block is bound to the conversation before it: a summary,
    # cleared tool results or a system prompt rebuilt for a turn invalidate
    # it, and on accounts created on or after 2026-08-31 the API refuses the
    # request (400). `drop_block` has the API drop such blocks instead.
    thinking_block_binding: drop_block
    # Anthropic's automatic prompt caching: each request caches its prompt and
    # the next one reads the unchanged part at the cache-read price. `5m` or
    # `1h` (writes cost 1.25x or 2x input). Unset: nothing is cached. An hour
    # keeps the cache across a pause in a conversation and for a run in the
    # background that comes back to the same context; with it,
    # `cache_creation_tokens` below is priced as an hour's write.
    prompt_cache: 1h
    # Old tool results cleared by the API, not in the history sent: the
    # history stays as it was, so the cache and the thinking blocks bound to
    # it stay valid. Every clearing still rewrites the cached prompt from the
    # cleared result on, so `clear_at_least` keeps clearings few and large.
    context_management:
      edits:
        - type: clear_tool_uses_20250919
          trigger: {type: input_tokens, value: 30000}
          keep: {type: tool_uses, value: 3}
          clear_at_least: {type: input_tokens, value: 5000}
          clear_tool_inputs: true
          exclude_tools: [write_todos]
    pricing:
      currency: USD
      input:
        cost_per_1m: 4 # $4 / MTok
      output:
        cost_per_1m: 20 # $20 / MTok
      extras:
        cache_write_tokens:
          cost_per_1m: 5 # $5 / MTok, 1.25x input
        cache_write_1h_tokens:
          cost_per_1m: 8 # $8 / MTok, 2x input
        cache_read_tokens:
          cost_per_1m: 0.2 # $0.20 / MTok, 0.05x input
      key_aliases:
        prompt_tokens: input_tokens
        completion_tokens: output_tokens
        cache_read: cache_read_tokens
        ephemeral_5m_input_tokens_tokens: cache_write_tokens
        ephemeral_1h_input_tokens_tokens: cache_write_1h_tokens
        # A write the response does not break down: prompt_cache's lifetime.
        cache_creation_tokens: cache_write_1h_tokens
      rounding:
        decimals: 6
      # Keys that only break down input or output: no price, not estimated.
      extras_policy:
        breakdown_keys: [total_tokens, reasoning_tokens]

  claude-sonnet-5-5:
    provider: 'claude'
    display_name: 'Claude Sonnet 5.5'
    description: 'Claude Sonnet 5.5, fast and capable for everyday agent work'
    max_tokens: 8192
    multimodal: true
    reasoning_config:
      thinking:
        type: "adaptive"
        display: "summarized"
    # A thinking block is bound to the conversation before it: a summary,
    # cleared tool results or a system prompt rebuilt for a turn invalidate
    # it, and on accounts created on or after 2026-08-31 the API refuses the
    # request (400). `drop_block` has the API drop such blocks instead.
    thinking_block_binding: drop_block
    # Anthropic's automatic prompt caching: each request caches its prompt and
    # the next one reads the unchanged part at the cache-read price. `5m` or
    # `1h` (writes cost 1.25x or 2x input). Unset: nothing is cached. An hour
    # keeps the cache across a pause in a conversation and for a run in the
    # background that comes back to the same context; with it,
    # `cache_creation_tokens` below is priced as an hour's write.
    prompt_cache: 1h
    # Old tool results cleared by the API, not in the history sent: the
    # history stays as it was, so the cache and the thinking blocks bound to
    # it stay valid. Every clearing still rewrites the cached prompt from the
    # cleared result on, so `clear_at_least` keeps clearings few and large.
    context_management:
      edits:
        - type: clear_tool_uses_20250919
          trigger: {type: input_tokens, value: 30000}
          keep: {type: tool_uses, value: 3}
          clear_at_least: {type: input_tokens, value: 5000}
          clear_tool_inputs: true
          exclude_tools: [write_todos]
    pricing:
      currency: USD
      input:
        cost_per_1m: 2 # $2 / MTok
      output:
        cost_per_1m: 10 # $10 / MTok
      extras:
        cache_write_tokens:
          cost_per_1m: 2.5 # $2.50 / MTok, 1.25x input
        cache_write_1h_tokens:
          cost_per_1m: 4 # $4 / MTok, 2x input
        cache_read_tokens:
          cost_per_1m: 0.1 # $0.10 / MTok, 0.05x input
      key_aliases:
        prompt_tokens: input_tokens
        completion_tokens: output_tokens
        cache_read: cache_read_tokens
        ephemeral_5m_input_tokens_tokens: cache_write_tokens
        ephemeral_1h_input_tokens_tokens: cache_write_1h_tokens
        # A write the response does not break down: prompt_cache's lifetime.
        cache_creation_tokens: cache_write_1h_tokens
      rounding:
        decimals: 6
      # Keys that only break down input or output: no price, not estimated.
      extras_policy:
        breakdown_keys: [total_tokens, reasoning_tokens]

  claude-haiku-5-5:
    provider: 'claude'
    display_name: 'Claude Haiku 5.5'
    description: 'Fastest and cheapest Claude model'
    max_tokens: 8192
    multimodal: true
    reasoning_config:
      thinking:
        type: "adaptive"
        display: "summarized"
    # A thinking block is bound to the conversation before it: a summary,
    # cleared tool results or a system prompt rebuilt for a turn invalidate
    # it, and on accounts created on or after 2026-08-31 the API refuses the
    # request (400). `drop_block` has the API drop such blocks instead.
    thinking_block_binding: drop_block
    # Anthropic's automatic prompt caching: each request caches its prompt and
    # the next one reads the unchanged part at the cache-read price. `5m` or
    # `1h` (writes cost 1.25x or 2x input). Unset: nothing is cached. An hour
    # keeps the cache across a pause in a conversation and for a run in the
    # background that comes back to the same context; with it,
    # `cache_creation_tokens` below is priced as an hour's write.
    prompt_cache: 1h
    # Old tool results cleared by the API, not in the history sent: the
    # history stays as it was, so the cache and the thinking blocks bound to
    # it stay valid. Every clearing still rewrites the cached prompt from the
    # cleared result on, so `clear_at_least` keeps clearings few and large.
    context_management:
      edits:
        - type: clear_tool_uses_20250919
          trigger: {type: input_tokens, value: 30000}
          keep: {type: tool_uses, value: 3}
          clear_at_least: {type: input_tokens, value: 5000}
          clear_tool_inputs: true
          exclude_tools: [write_todos]
    pricing:
      currency: USD
      # base prices correspond to prompts of up to 100K tokens
      input:
        cost_per_1m: 0.1 # $0.10 / MTok
      output:
        cost_per_1m: 0.5 # $0.50 / MTok
      extras:
        cache_write_tokens:
          cost_per_1m: 0.125 # $0.125 / MTok, 1.25x input
        cache_write_1h_tokens:
          cost_per_1m: 0.2 # $0.20 / MTok, 2x input
        cache_read_tokens:
          cost_per_1m: 0.01 # $0.01 / MTok, 0.1x input
      # Tiered pricing by prompt size: `context_tiers` multiplies every price of
      # the entry by the multiplier of the first tier the request fits in.
      # Prompts over 100K tokens cost five times as much (0.50 / 2.50).
      context_tiers:
        - max_context: 100000
          multiplier: 1.0
        - max_context: 1000000
          multiplier: 5.0
      # Anthropic chooses the price by the prompt alone: "A request's prompt
      # length counts all of its input tokens, including cache reads and cache
      # writes." `input` does the same (the default, `total`, adds the output).
      context_tier_basis: input
      key_aliases:
        prompt_tokens: input_tokens
        completion_tokens: output_tokens
        cache_read: cache_read_tokens
        ephemeral_5m_input_tokens_tokens: cache_write_tokens
        ephemeral_1h_input_tokens_tokens: cache_write_1h_tokens
        # A write the response does not break down: prompt_cache's lifetime.
        cache_creation_tokens: cache_write_1h_tokens
      rounding:
        decimals: 6
      # Keys that only break down input or output: no price, not estimated.
      extras_policy:
        breakdown_keys: [total_tokens, reasoning_tokens]

  # Ollama Models (local server)
  'gemma3:4b':
    provider: 'ollama'
    display_name: 'Gemma 3 4B (Ollama)'
